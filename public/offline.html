<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - ToolLab Invoice</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 40px;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    p {
      color: #64748B;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background: #4F46E5;
      color: #ffffff;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="ToolLab" class="logo">
    <h1>You are currently offline</h1>
    <p>Financial operations require an active network connection to ensure real-time ledger consistency and prevent duplicate submissions. Please check your internet connection.</p>
    <a href="/" class="btn" onclick="window.location.reload(); return false;">Try Reconnecting</a>
  </div>
</body>
</html>
